<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantine Congolaise</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="accueil" class="screen">
  <div class="header">
    <div class="logo"><i data-lucide="piggy-bank"></i> Tantine Congolaise</div>
    <i data-lucide="bell"></i>
  </div>
  
  <div class="card">
    <p class="label">Solde Total</p>
    <div class="solde" id="solde">0 FCFA</div>
    <p class="sub">Commencez votre épargne dès aujourd'hui</p>
  </div>

  <div class="card">
    <h3><i data-lucide="target"></i> Objectif 6 Mois</h3>
    <p class="sub">Construisez votre épargne petit à petit.</p>
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
    <div class="row">
      <span id="jours">0 / 180 jours</span>
      <span id="pourcent">0%</span>
    </div>
    <div class="row" style="margin-top:15px">
      <div>
        <p class="label">Montant épargné</p>
        <h2 id="epargne">0 FCFA</h2>
      </div>
      <div class="right">
        <p class="label">Objectif</p>
        <h2>90 000 FCFA</h2>
      </div>
    </div>
  </div>

  <div class="card btn-card">
    <button class="btn-main" onclick="showScreen('cotiser')">
      <i data-lucide="plus-circle"></i> Épargner
    </button>
  </div>
</div>

<div id="cotiser" class="screen hidden">
  <div class="header"><i data-lucide="arrow-left" onclick="showScreen('accueil')"></i> <h2>Épargner</h2></div>
  <div class="card">
    <h3>Choisissez le montant</h3>
    <button class="btn-amount" onclick="selectMontant(250)">250 FCFA</button>
    <button class="btn-amount active" onclick="selectMontant(500)">500 FCFA</button>
    <button class="btn-amount" onclick="selectMontant(1000)">1000 FCFA</button>
  </div>
  <div class="card">
    <h3>Votre numéro Mobile Money</h3>
    <input type="tel" id="telephone" placeholder="06 123 4567" class="input">
    <div class="row-btn">
      <button class="btn-momo"><i data-lucide="smartphone"></i> MTN Money</button>
      <button class="btn-momo"><i data-lucide="smartphone"></i> Airtel Money</button>
    </div>
    <button class="btn-main" onclick="payer()">Confirmer le paiement</button>
  </div>
</div>

<div class="nav">
  <div class="nav-item active" onclick="showScreen('accueil')"><i data-lucide="home"></i><div>Accueil</div></div>
  <div class="nav-item" onclick="showScreen('cotiser')"><i data-lucide="wallet"></i><div>Cotiser</div></div>
  <div class="nav-item"><i data-lucide="briefcase"></i><div>Projet</div></div>
</div>

<script src="app.js"></script>
</body>
                                      </html>
