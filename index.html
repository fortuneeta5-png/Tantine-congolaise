<!-- 0. ECRAN INSCRIPTION -->
<div id="inscription" class="screen">
  <div style="padding:40px 20px; text-align:center;">
    <h2 style="color:#008751; margin-bottom:10px;">Bienvenue sur Tantine</h2>
    <p style="color:#888; margin-bottom:30px;">Crée ton compte en 10 secondes</p>
    
    <input id="nom" type="text" placeholder="Nom et Prénom" style="width:100%; padding:15px; margin-bottom:15px; border:1px solid #ddd; border-radius:12px;">
    <input id="telephone" type="tel" placeholder="Numéro MTN / Airtel" style="width:100%; padding:15px; margin-bottom:15px; border:1px solid #ddd; border-radius:12px;">
    <input id="email" type="email" placeholder="Adresse Email" style="width:100%; padding:15px; margin-bottom:20px; border:1px solid #ddd; border-radius:12px;">
    
    <button class="btn-main" onclick="creerCompte()">Créer mon compte</button>
  </div>
</div>
