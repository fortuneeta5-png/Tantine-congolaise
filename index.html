<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tantine Congolaise</title>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Poppins, sans-serif; background:#F5F5F5; margin:0}
  .screen{max-width:420px; margin:auto; background:white; min-height:100vh; padding-bottom:80px}
  .hidden{display:none}
  .header{display:flex; justify-content:space-between; align-items:center; padding:15px 20px}
  .user{display:flex; align-items:center; gap:10px} .user img{width:45px; height:45px; border-radius:50%}
  .card-balance{background:#008751; color:white; border-radius:20px; padding:20px; margin:20px}
  .solde{font-size:32px; font-weight:700; margin:8px 0}
  .btn-main{width:100%; padding:16px; background:#008751; color:white; border:none; border-radius:12px; font-weight:600; font-size:16px; margin-bottom:12px}
  .quick-services{display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:0 20px}
  .service{text-align:center; cursor:pointer} .service-icon{background:#E8F5F0; border-radius:16px; padding:15px; margin-bottom:8px; color:#008751}
  .nav{position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:auto; background:white; display:flex; justify-content:space-around; padding:10px 0; border-top:1px solid #eee}
  .nav-item{text-align:center; color:#888; cursor:pointer} .nav-item.active{color:#008751}
  input{width:100%; padding:15px; margin-bottom:15px; border:1px solid #ddd; border-radius:12px; box-sizing:border-box}
</style>
</head>
<body>

<!-- ECRAN INSCRIPTION -->
<div id="inscription" class="screen">
  <div style="padding:40px 20px; text-align:center;">
    <h2 style="color:#008751; margin-bottom:10px;">Bienvenue sur Tantine</h2>
    <p style="color:#888; margin-bottom:30px;">Crée ton compte en 10 secondes</p>
    <input id="nom" type="text" placeholder="Nom et Prénom">
    <input id="telephone" type="tel" placeholder="Numéro MTN / Airtel">
    <input id="email" type="email" placeholder="Adresse Email">
    <button onclick="creerCompte()" class="btn-main">Créer mon compte</button>
  </div>
</div>

<!-- ECRAN ACCUEIL -->
<div id="accueil" class="screen hidden">
  <div class="header">
    <div class="user"><img src="https://i.pravatar.cc/100">
      <div><p style="margin:0; color:#888">Good morning 👋</p><h2 id="username" style="margin:0">Tantine</h2></div>
    </div>
    <i data-lucide="bell" onclick="alert('Bientôt')"></i>
  </div>
  <div class="card-balance">
    <div>Solde Total</div>
    <div class="solde" id="solde">0 FCFA</div>
    <div>Bonus épargne: <span id="bonus">0</span> FCFA</div>
  </div>
  <h3 style="padding:0 20px">Services Rapides</h3>
  <div class="quick-services">
    <div class="service" onclick="showScreen('cotiser')"><div class="service-icon"><i data-lucide="plus"></i></div><div>Épargner</div></div>
    <div class="service" onclick="showScreen('retirer')"><div class="service-icon"><i data-lucide="arrow-right-left"></i></div><div>Retirer</div></div>
    <div class="service" onclick="alert('Bientôt')"><div class="service-icon"><i data-lucide="target"></i></div><div>Objectif</div></div>
  </div>
  <div class="nav">
    <div class="nav-item active" onclick="showScreen('accueil')"><i data-lucide="home"></i><div>Accueil</div></div>
    <div class="nav-item" onclick="showScreen('historique')"><i data-lucide="history"></i><div>Historique</div></div>
  </div>
</div>

<!-- ECRAN COTISER -->
<div id="cotiser" class="screen hidden"><div class="header"><i data-lucide="arrow-left" onclick="showScreen('accueil')"></i> <h2>Épargner</h2></div>
  <div style="padding:20px">
    <button class="btn-main" onclick="selectMontant(250)">Épargner 250 FCFA</button>
    <button class="btn-main" onclick="selectMontant(500)">Épargner 500 FCFA</button>
    <button class="btn-main" onclick="selectMontant(1000)">Épargner 1000 FCFA</button>
  </div>
</div>

<!-- ECRAN RETIRER -->
<div id="retirer" class="screen hidden"><div class="header"><i data-lucide="arrow-left" onclick="showScreen('accueil')"></i> <h2>Retirer</h2></div>
  <div style="padding:20px">
    <input id="montantRetrait" type="number" placeholder="Montant à retirer">
    <button class="btn-main" onclick="faireRetrait()">Confirmer Retrait</button>
  </div>
</div>

<!-- ECRAN HISTORIQUE -->
<div id="historique" class="screen hidden"><div class="header"><i data-lucide="arrow-left" onclick="showScreen('accueil')"></i> <h2>Historique</h2></div>
  <div id="listeHistorique" style="padding:20px"></div>
</div>

<script>
let user = JSON.parse(localStorage.getItem('user'));
let solde = parseInt(localStorage.getItem('solde')) || 0;
let epargne = parseInt(localStorage.getItem('epargne')) || 0;
let bonus = parseInt(localStorage.getItem('bonus')) || 0;
let historique = JSON.parse(localStorage.getItem('historique')) || [];

window.onload = () => {
  if(!user) { showScreen('inscription'); } 
  else { showScreen('accueil'); updateUI(); }
  lucide.createIcons();
}

function creerCompte() {
  let nom = document.getElementById('nom').value;
  let tel = document.getElementById('telephone').value;
  let mail = document.getElementById('email').value;
  if(nom === "" || tel.length < 9 || mail === "") { alert("Remplis tous les champs"); return; }
  user = {nom: nom, telephone: tel, email: mail};
  localStorage.setItem('user', JSON.stringify(user));
  alert(`Bienvenue ${nom} !`);
  showScreen('accueil'); updateUI();
}

function updateUI() {
  document.getElementById('solde').innerText = solde.toLocaleString() + ' FCFA';
  document.getElementById('epargne') ? document.getElementById('epargne').innerText = epargne.toLocaleString() + ' FCFA' : '';
  document.getElementById('bonus').innerText = bonus.toLocaleString();
  document.getElementById('username').innerText = user.nom.split(' ')[0];
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id === 'historique') afficherHistorique();
  lucide.createIcons();
}

function selectMontant(montant) {
  solde += montant; epargne += montant; bonus += Math.floor(montant * 0.05);
  historique.unshift({type: "Dépôt", montant: montant, date: new Date().toLocaleString()});
  sauvegarder(); alert(`✅ Épargne de ${montant} FCFA réussie !`); showScreen('accueil');
}

function faireRetrait() {
  let montant = parseInt(document.getElementById('montantRetrait').value);
  if(montant > solde) { alert("Solde insuffisant"); return; }
  solde -= montant; historique.unshift({type: "Retrait", montant: montant, date: new Date().toLocaleString()});
  sauvegarder(); alert(`✅ Retrait de ${montant} FCFA effectué`); showScreen('accueil');
}

function afficherHistorique() {
  let liste = document.getElementById('listeHistorique');
  liste.innerHTML = historique.length === 0 ? "Aucune transaction" : historique.map(h => `<div style="padding:15px; border-bottom:1px solid #eee;"><b>${h.type}</b> : ${h.montant} FCFA <br><small style="color:#888">${h.date}</small></div>`).join('');
}

function sauvegarder() {
  localStorage.setItem('solde', solde); localStorage.setItem('epargne', epargne); 
  localStorage.setItem('bonus', bonus); localStorage.setItem('historique', JSON.stringify(historique)); updateUI();
}
</script>
</body>
      </html>
